<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>(function(){try{var t=localStorage.getItem('opsmanifest_theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icon-512.png" sizes="512x512" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D9488" />
    <meta name="description" content="Guided provisioning workflow for infra teams — from hardware selection through CAB approval, RTM sign-off and closure." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OpsManifest" />
    <title>OpsManifest — Infrastructure Lifecycle Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Splash loader: visible until React mounts and hides it -->
    <div id="splash" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;gap:20px;">
      <img src="/icon-192.png" alt="OpsManifest" style="width:72px;height:72px;border-radius:16px;" />
      <div style="color:#f1f5f9;font-family:Inter,sans-serif;font-size:18px;font-weight:600;letter-spacing:0.01em;">OpsManifest</div>
      <div style="color:#94a3b8;font-family:Inter,sans-serif;font-size:13px;margin-top:-8px;">Infrastructure Lifecycle Engine</div>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <div class="splash-dot" style="animation-delay:0s"></div>
        <div class="splash-dot" style="animation-delay:0.2s"></div>
        <div class="splash-dot" style="animation-delay:0.4s"></div>
      </div>
    </div>
    <style>
      .splash-dot{width:8px;height:8px;border-radius:50%;background:#0d9488;animation:splash-pulse 1.2s ease-in-out infinite;}
      @keyframes splash-pulse{0%,80%,100%{transform:scale(0.6);opacity:0.4;}40%{transform:scale(1);opacity:1;}}
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // If the JS bundle never executes (network blocked, script load error),
      // replace the infinite splash with an actionable error message after 12s.
      window.__splashFallbackTimer = setTimeout(function() {
        if (window.__appMounted) return;
        var s = document.getElementById('splash');
        if (!s) return;
        s.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px;text-align:center"><img src="/icon-192.png" alt="OpsManifest" style="width:64px;height:64px;border-radius:12px"><div style="color:#f1f5f9;font-family:Inter,sans-serif;font-size:17px;font-weight:600">OpsManifest</div><div style="color:#94a3b8;font-family:Inter,sans-serif;font-size:13px">Unable to load. Please check your connection.</div><button onclick="location.reload()" style="margin-top:8px;background:#0d9488;color:#fff;border:none;padding:8px 24px;border-radius:6px;cursor:pointer;font-family:Inter,sans-serif;font-size:14px;font-weight:500">Retry</button></div>';
      }, 12000);
    </script>
  </body>
</html>
