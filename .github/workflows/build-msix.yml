name: Build MSIX for Microsoft Store

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package/Identity/Name from Partner Center App identity page'
        required: false
        default: 'Flourishing.opsmanifest'
      publisher_id:
        description: 'Package/Identity/Publisher from Partner Center App identity page'
        required: false
        default: 'CN=CF05ACFD-1A2C-4D3B-85CE-80828C73812E'
      publisher_display_name:
        description: 'Publisher display name from Partner Center App identity page'
        required: false
        default: 'Flourishing'
      app_version:
        description: 'App version (x.x.x.x format)'
        required: false
        default: '1.2.0.0'

jobs:
  build-msix:
    runs-on: windows-latest

    steps:
      - name: Prepare folders
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path msix\images -Force | Out-Null
          New-Item -ItemType Directory -Path store-listing-images -Force | Out-Null

      - name: Download app icon
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://opsmanifest.netlify.app/icon-512.png" `
            -OutFile "msix\images\source.png"

      - name: Generate MSIX icon sizes + store listing images
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing

          $src = [System.Drawing.Image]::FromFile(
            (Resolve-Path "msix\images\source.png").Path
          )

          function Resize-Image($src, $w, $h, $outPath) {
            $bmp = New-Object System.Drawing.Bitmap($w, $h)
            $g   = [System.Drawing.Graphics]::FromImage($bmp)
            $g.Clear([System.Drawing.Color]::FromArgb(255, 15, 31, 53))
            $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
            $g.SmoothingMode     = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
            $ratio = [Math]::Min($w / $src.Width, $h / $src.Height)
            $dw = [int]($src.Width  * $ratio)
            $dh = [int]($src.Height * $ratio)
            $dx = [int](($w - $dw) / 2)
            $dy = [int](($h - $dh) / 2)
            $g.DrawImage($src, $dx, $dy, $dw, $dh)
            $g.Dispose()
            $bmp.Save($outPath, [System.Drawing.Imaging.ImageFormat]::Png)
            $bmp.Dispose()
            Write-Host "  $outPath ($w x $h)"
          }

          # MSIX tile icons (required by AppxManifest)
          Resize-Image $src  44  44 "msix\images\Square44x44Logo.png"
          Resize-Image $src  71  71 "msix\images\Square71x71Logo.png"
          Resize-Image $src 150 150 "msix\images\Square150x150Logo.png"
          Resize-Image $src 310 310 "msix\images\Square310x310Logo.png"
          Resize-Image $src 310 150 "msix\images\Wide310x150Logo.png"
          Resize-Image $src  50  50 "msix\images\StoreLogo.png"
          Resize-Image $src 620 300 "msix\images\SplashScreen.png"

          # Store listing images (uploaded separately in Partner Center listing page)
          Resize-Image $src 300 300 "store-listing-images\StoreLogo-300x300.png"
          Resize-Image $src 512 512 "store-listing-images\AppIcon-512x512.png"

          $src.Dispose()

      - name: Write AppxManifest.xml
        shell: powershell
        env:
          PACKAGE_NAME:           ${{ github.event.inputs.package_name }}
          PUBLISHER_ID:           ${{ github.event.inputs.publisher_id }}
          PUBLISHER_DISPLAY_NAME: ${{ github.event.inputs.publisher_display_name }}
          APP_VERSION:            ${{ github.event.inputs.app_version }}
        run: |
          # Use XmlWriter so no encoding surprises — no BOM, no invisible chars
          $packageName          = $env:PACKAGE_NAME.Trim()
          $publisherId          = $env:PUBLISHER_ID.Trim()
          $publisherDisplayName = $env:PUBLISHER_DISPLAY_NAME.Trim()
          $appVersion           = $env:APP_VERSION.Trim()

          $outPath = (Resolve-Path "msix").Path + "\AppxManifest.xml"
          $settings = New-Object System.Xml.XmlWriterSettings
          $settings.Indent = $true
          $settings.IndentChars = "  "
          $settings.Encoding = New-Object System.Text.UTF8Encoding($false) # no BOM
          $settings.OmitXmlDeclaration = $false

          $w = [System.Xml.XmlWriter]::Create($outPath, $settings)

          $ns    = "http://schemas.microsoft.com/appx/manifest/foundation/windows10"
          $nsUap  = "http://schemas.microsoft.com/appx/manifest/uap/windows10"

          $w.WriteStartDocument()
          $w.WriteStartElement("Package", $ns)
          $w.WriteAttributeString("xmlns", "uap", $null, $nsUap)

            # Identity
            $w.WriteStartElement("Identity", $ns)
            $w.WriteAttributeString("Name",                 $packageName)
            $w.WriteAttributeString("Publisher",            $publisherId)
            $w.WriteAttributeString("Version",              $appVersion)
            $w.WriteAttributeString("ProcessorArchitecture","neutral")
            $w.WriteEndElement()

            # Properties
            $w.WriteStartElement("Properties", $ns)
              $w.WriteElementString("DisplayName",          $ns, "OpsManifest")
              $w.WriteElementString("PublisherDisplayName", $ns, $publisherDisplayName)
              $w.WriteElementString("Description",          $ns, "Guided provisioning workflow for infra teams")
              $w.WriteElementString("Logo",                 $ns, "images\StoreLogo.png")
            $w.WriteEndElement()

            # Dependencies
            $w.WriteStartElement("Dependencies", $ns)
              $w.WriteStartElement("TargetDeviceFamily", $ns)
              $w.WriteAttributeString("Name",               "Windows.Universal")
              $w.WriteAttributeString("MinVersion",         "10.0.17763.0")
              $w.WriteAttributeString("MaxVersionTested",   "10.0.26200.0")
              $w.WriteEndElement()
            $w.WriteEndElement()

            # Resources
            $w.WriteStartElement("Resources", $ns)
              $w.WriteStartElement("Resource", $ns)
              $w.WriteAttributeString("Language", "en-us")
              $w.WriteEndElement()
            $w.WriteEndElement()

            # Applications
            $w.WriteStartElement("Applications", $ns)
              $w.WriteStartElement("Application", $ns)
              $w.WriteAttributeString("Id",        "App")
              $w.WriteAttributeString("StartPage", "https://opsmanifest.netlify.app")

                $w.WriteStartElement("VisualElements", $nsUap)
                $w.WriteAttributeString("DisplayName",         "OpsManifest")
                $w.WriteAttributeString("Description",         "Guided provisioning workflow for infra teams")
                $w.WriteAttributeString("BackgroundColor",     "#0F1F35")
                $w.WriteAttributeString("Square150x150Logo",   "images\Square150x150Logo.png")
                $w.WriteAttributeString("Square44x44Logo",     "images\Square44x44Logo.png")

                  $w.WriteStartElement("DefaultTile", $nsUap)
                  $w.WriteAttributeString("Wide310x150Logo",   "images\Wide310x150Logo.png")
                  $w.WriteAttributeString("Square310x310Logo", "images\Square310x310Logo.png")
                  $w.WriteAttributeString("Square71x71Logo",   "images\Square71x71Logo.png")
                  $w.WriteAttributeString("ShortName",         "OpsManifest")
                    $w.WriteStartElement("ShowNameOnTiles", $nsUap)
                      $w.WriteStartElement("ShowOn", $nsUap)
                      $w.WriteAttributeString("Tile", "square150x150Logo")
                      $w.WriteEndElement()
                      $w.WriteStartElement("ShowOn", $nsUap)
                      $w.WriteAttributeString("Tile", "wide310x150Logo")
                      $w.WriteEndElement()
                    $w.WriteEndElement()
                  $w.WriteEndElement() # DefaultTile

                  $w.WriteStartElement("SplashScreen", $nsUap)
                  $w.WriteAttributeString("Image",           "images\SplashScreen.png")
                  $w.WriteAttributeString("BackgroundColor", "#0F1F35")
                  $w.WriteEndElement()

                $w.WriteEndElement() # VisualElements

              $w.WriteEndElement() # Application
            $w.WriteEndElement() # Applications

            # Capabilities
            $w.WriteStartElement("Capabilities", $ns)
              $w.WriteStartElement("Capability", $ns)
              $w.WriteAttributeString("Name", "internetClient")
              $w.WriteEndElement()
            $w.WriteEndElement()

          $w.WriteEndElement() # Package
          $w.WriteEndDocument()
          $w.Flush()
          $w.Close()

          # Show the exact bytes of PublisherDisplayName for verification
          $xml = [xml](Get-Content $outPath -Raw)
          $stored = $xml.Package.Properties.PublisherDisplayName
          $bytes  = [System.Text.Encoding]::UTF8.GetBytes($stored) | ForEach-Object { $_.ToString("X2") }
          Write-Host "PublisherDisplayName value : '$stored'"
          Write-Host "PublisherDisplayName bytes : $($bytes -join ' ')"
          Write-Host "AppxManifest.xml written to $outPath"

      - name: Generate resources.pri
        shell: powershell
        run: |
          $priConfig = @"
          <?xml version="1.0" encoding="utf-8"?>
          <resources targetOsVersion="10.0.0" majorVersion="1">
            <packaging>
              <autoResourcePackage qualifier="Language" />
            </packaging>
            <index root="\" startIndexAt="\">
              <default>
                <qualifier name="Language" value="en-US" />
              </default>
            </index>
          </resources>
          "@
          $priConfig | Out-File -FilePath "msix\priconfig.xml" -Encoding utf8

          $makepri = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter makepri.exe -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1

          if ($makepri) {
            Write-Host "makepri: $($makepri.FullName)"
            & $makepri.FullName createconfig /cf msix\priconfig.xml /dq en-US /pv 10.0.0 /o
            & $makepri.FullName new /pr msix /cf msix\priconfig.xml /mn msix\AppxManifest.xml /of msix\resources.pri /o
          } else {
            Write-Host "makepri not found - store will handle resources"
          }

      - name: Package MSIX with MakeAppx
        shell: powershell
        run: |
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter makeappx.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like "*x64*" } |
            Sort-Object FullName -Descending | Select-Object -First 1

          if (-not $makeappx) {
            $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
              -Recurse -Filter makeappx.exe -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1
          }

          if (-not $makeappx) {
            Write-Error "makeappx.exe not found"
            exit 1
          }

          Write-Host "makeappx: $($makeappx.FullName)"
          & $makeappx.FullName pack /d msix /p opsmanifest.msix /o
          Write-Host "MSIX created"

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: opsmanifest-msix
          path: opsmanifest.msix
          retention-days: 30

      - name: Upload store listing images
        uses: actions/upload-artifact@v4
        with:
          name: store-listing-images
          path: store-listing-images\
          retention-days: 30
