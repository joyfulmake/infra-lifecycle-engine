name: Build MSIX for Microsoft Store

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package/Identity/Name from Partner Center App identity page'
        required: false
        default: 'Flourishing.opsmanifest'
      publisher_id:
        description: 'Package/Identity/Publisher from Partner Center App identity page'
        required: false
        default: 'CN=CF05ACFD-1A2C-4D3B-85CE-80828C73812E'
      publisher_display_name:
        description: 'Publisher display name from Partner Center App identity page'
        required: false
        default: 'Flourishing'
      app_version:
        description: 'App version (x.x.x.x format)'
        required: false
        default: '2.7.0.0'

jobs:
  build-msix:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies and build app
        shell: powershell
        run: |
          npm ci
          npm run build
          Write-Host "Vite build complete - dist/ ready"

      - name: Prepare folders
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path msix\images -Force | Out-Null
          New-Item -ItemType Directory -Path store-listing-images -Force | Out-Null

      - name: Copy app icon from repo
        shell: powershell
        run: |
          Copy-Item "public\icon-512.png" "msix\images\source.png"

      - name: Generate MSIX icon sizes + store listing images
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing

          $src = [System.Drawing.Image]::FromFile(
            (Resolve-Path "msix\images\source.png").Path
          )

          function Resize-Image($src, $w, $h, $outPath) {
            $bmp = New-Object System.Drawing.Bitmap($w, $h)
            $g   = [System.Drawing.Graphics]::FromImage($bmp)
            $g.Clear([System.Drawing.Color]::FromArgb(255, 15, 31, 53))
            $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
            $g.SmoothingMode     = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
            $ratio = [Math]::Min($w / $src.Width, $h / $src.Height)
            $dw = [int]($src.Width  * $ratio)
            $dh = [int]($src.Height * $ratio)
            $dx = [int](($w - $dw) / 2)
            $dy = [int](($h - $dh) / 2)
            $g.DrawImage($src, $dx, $dy, $dw, $dh)
            $g.Dispose()
            $bmp.Save($outPath, [System.Drawing.Imaging.ImageFormat]::Png)
            $bmp.Dispose()
            Write-Host "  $outPath ($w x $h)"
          }

          # MSIX tile icons (required by AppxManifest)
          Resize-Image $src  44  44 "msix\images\Square44x44Logo.png"
          Resize-Image $src  71  71 "msix\images\Square71x71Logo.png"
          Resize-Image $src 150 150 "msix\images\Square150x150Logo.png"
          Resize-Image $src 310 310 "msix\images\Square310x310Logo.png"
          Resize-Image $src 310 150 "msix\images\Wide310x150Logo.png"
          Resize-Image $src  50  50 "msix\images\StoreLogo.png"
          Resize-Image $src 620 300 "msix\images\SplashScreen.png"

          # Store listing images (uploaded separately in Partner Center listing page)
          Resize-Image $src 300 300 "store-listing-images\StoreLogo-300x300.png"
          Resize-Image $src 512 512 "store-listing-images\AppIcon-512x512.png"

          $src.Dispose()

      - name: Copy web app bundle into MSIX package root
        shell: powershell
        run: |
          # Bundle the Vite build output into the MSIX so the app loads from
          # ms-appx-web:/// with no network dependency - eliminates the cert-lab
          # "unreachable CDN" failure that has blocked every submission so far.
          Copy-Item -Path "dist\*" -Destination "msix\" -Recurse -Force
          Write-Host "Copied dist/ contents to msix/"

          # Remove sw.js from the package - the app loads from ms-appx-web://
          # with no network dependency, so a service worker is unnecessary.
          # More critically: a SW from a previous MSIX version can survive updates
          # in the WebView2 data folder and will crash the WebView2 renderer on
          # Windows 11 24H2 by intercepting ms-appx-web: scheme fetch events.
          # Removing the file eliminates any possibility of SW activation in the package.
          Remove-Item "msix\sw.js" -ErrorAction SilentlyContinue
          Write-Host "Removed sw.js from MSIX package (not needed, prevents WebView2 crash)"

          Get-ChildItem msix | Select-Object Name, Length | Format-Table -AutoSize

      - name: Strip crossorigin attributes from index.html
        shell: powershell
        run: |
          # CRITICAL: Vite 8 (rolldown) emits `crossorigin` on every <script>, <link>, and
          # <link rel="modulepreload"> tag. In ms-appx-web: context, the `crossorigin`
          # attribute causes WebView2 to apply CORS semantics to local package resources.
          # On Windows 11 24H2 (26100.3194) this crashes the WebView2 renderer natively
          # with no JS error (Error: N/A in Store certification reports).
          # Stripping `crossorigin` from all tags in index.html fixes this — local
          # ms-appx-web: resources are always same-origin, so CORS attributes are
          # unnecessary and harmful on these specific OS builds.
          $htmlPath = "msix\index.html"
          $html = Get-Content $htmlPath -Raw -Encoding UTF8
          $before = ([regex]::Matches($html, '\bcrossorigin\b')).Count
          # Pass 1: remove crossorigin="value" or crossorigin='' (any whitespace prefix, any value)
          $html = [regex]::Replace($html, '\s+crossorigin(?:="[^"]*"|=''[^'']*'')?(?=[\s/>])', '')
          # Pass 2: remove bare `crossorigin` boolean attribute (no value, any leading whitespace)
          $html = [regex]::Replace($html, '\s+crossorigin\b', '')
          $after = ([regex]::Matches($html, '\bcrossorigin\b')).Count
          Set-Content $htmlPath $html -Encoding UTF8 -NoNewline
          Write-Host "Stripped $before crossorigin occurrences (remaining: $after)"
          if ($after -gt 0) {
            Write-Error "FATAL: crossorigin attributes remain in index.html after stripping. Vite output format may have changed."
            exit 1
          }

      - name: Remove web-only files and strip HTML resource links from MSIX
        shell: powershell
        run: |
          # ── Remove ALL web-only files from the MSIX root ─────────────────────
          # Only index.html, icon PNGs, and assets/ are needed.
          # Every extra HTML/JSON/SVG file is an unnecessary load vector;
          # some cause WebView2 resource fetches at parse time that can crash
          # the renderer on certain OS builds before any JS executes.
          $webOnly = @(
            "demo.html", "slides.html", "404.html", "privacy.html",
            "aup.html", "dpa.html", "msa.html", "sla.html", "tos.html",
            "_headers", "_redirects", "manifest.json",
            "favicon.svg", "icons.svg"
          )
          foreach ($f in $webOnly) {
            Remove-Item "msix\$f" -ErrorAction SilentlyContinue
          }
          Write-Host "Removed web-only files from MSIX root"

          # ── Strip all resource-triggering <link> tags from index.html ────────
          # manifest    — PWA manifest fetch crashes WebView2 on 26200.8655.
          # icon        — favicon.svg fetch (now removed from package) triggers
          #               URL resolution during HTML parse on 26200.8116.
          # apple-touch-icon — same; unused in MSIX context (icon from AppxManifest).
          $htmlPath = "msix\index.html"
          $html = Get-Content $htmlPath -Raw -Encoding UTF8
          $before = $html
          $html = [regex]::Replace($html, '\r?\n?\s*<link[^>]+rel="manifest"[^>]*/>', '')
          $html = [regex]::Replace($html, '\r?\n?\s*<link[^>]+rel=''manifest''[^>]*/>', '')
          $html = [regex]::Replace($html, '\r?\n?\s*<link[^>]+rel="icon"[^>]*/>', '')
          $html = [regex]::Replace($html, '\r?\n?\s*<link[^>]+rel=''icon''[^>]*/>', '')
          $html = [regex]::Replace($html, '\r?\n?\s*<link[^>]+rel="apple-touch-icon"[^>]*/>', '')
          $html = [regex]::Replace($html, '\r?\n?\s*<link[^>]+rel=''apple-touch-icon''[^>]*/>', '')
          if ($html -eq $before) {
            Write-Warning "No link tags stripped from index.html - check template"
          } else {
            Write-Host "Stripped manifest, icon, and apple-touch-icon links from index.html"
          }
          Set-Content $htmlPath $html -Encoding UTF8 -NoNewline

      - name: Strip Inter font files and @font-face rules from MSIX
        shell: powershell
        run: |
          # @fontsource/inter bundles 56+ woff/woff2 files and @font-face rules
          # into the CSS bundle. In ms-appx-web: context, Segoe UI is already forced
          # by the inline script in index.html — Inter is never used.
          #
          # ROOT CAUSE of 26200.8116 (Microsoft Surface Laptop) crash:
          # WebView2 on this build attempts to resolve @font-face src: URL() values
          # during CSS parse — BEFORE any JS runs — even for fonts not used by any
          # element. Loading woff2 from ms-appx-web: on this specific WebView2 build
          # triggers a native renderer crash (Error: N/A, no JS exception).
          #
          # Fix: delete all font files from the MSIX package AND strip every
          # @font-face block from the CSS bundle. The app is visually identical
          # using Segoe UI (Windows system font).

          # 1. Delete all Inter woff / woff2 files from msix/assets/
          $woff  = @(Get-ChildItem "msix\assets\*.woff"  -ErrorAction SilentlyContinue)
          $woff += @(Get-ChildItem "msix\assets\*.woff2" -ErrorAction SilentlyContinue)
          foreach ($f in $woff) { Remove-Item $f.FullName -Force }
          Write-Host "Removed $($woff.Count) Inter font files from msix/assets/"

          # 2. Strip @font-face AND @keyframes blocks from every CSS bundle in msix/assets/
          #    @font-face has no nested braces so [^}]+ stops at the first }.
          #    @keyframes has nested braces (each selector is its own {} block) so we
          #    use (?:[^{}]*\{[^{}]*\})+ to match one or more selector pairs.
          $cssFiles = @(Get-ChildItem "msix\assets\*.css" -ErrorAction SilentlyContinue)
          foreach ($css in $cssFiles) {
            $content = Get-Content $css.FullName -Raw -Encoding UTF8
            $before  = $content
            $content = [regex]::Replace($content, '@font-face\s*\{[^}]+\}', '')
            $content = [regex]::Replace($content, '@keyframes\s+[\w-]+\s*\{(?:[^{}]*\{[^{}]*\})+\}', '')
            if ($content -ne $before) {
              Set-Content $css.FullName $content -Encoding UTF8 -NoNewline
              $nFont = ([regex]::Matches($before, '@font-face\s*\{')).Count
              $nKf   = ([regex]::Matches($before, '@keyframes\s+')).Count
              Write-Host "Stripped $nFont @font-face + $nKf @keyframes blocks from $($css.Name)"
            } else {
              Write-Warning "No @font-face or @keyframes blocks found in $($css.Name) - check CSS bundle"
            }
          }

          # 3. Replace animated splash <style> in index.html with a static version
          #    @keyframes splash-pulse in the inline <style> block is another CSS
          #    parse-time feature that may crash certain WebView2 builds (26200.8655).
          $htmlPath = "msix\index.html"
          $html = Get-Content $htmlPath -Raw -Encoding UTF8
          $htmlBefore = $html
          $html = [regex]::Replace($html,
            '<style>\s*\.splash-dot\{[^<]+\}\s*</style>',
            '<style>.splash-dot{width:8px;height:8px;border-radius:50%;background:#0d9488;opacity:.6;display:inline-block;}</style>'
          )
          if ($html -ne $htmlBefore) {
            Set-Content $htmlPath $html -Encoding UTF8 -NoNewline
            Write-Host "Replaced animated splash style with static version in index.html"
          } else {
            Write-Warning "Animated splash style not found in index.html - check template"
          }

      - name: Write AppxManifest.xml
        shell: powershell
        env:
          PACKAGE_NAME:           ${{ github.event.inputs.package_name }}
          PUBLISHER_ID:           ${{ github.event.inputs.publisher_id }}
          PUBLISHER_DISPLAY_NAME: ${{ github.event.inputs.publisher_display_name }}
          APP_VERSION:            ${{ github.event.inputs.app_version }}
        run: |
          # Use XmlWriter so no encoding surprises - no BOM, no invisible chars
          $packageName          = $env:PACKAGE_NAME.Trim()
          $publisherId          = $env:PUBLISHER_ID.Trim()
          $publisherDisplayName = $env:PUBLISHER_DISPLAY_NAME.Trim()
          $appVersion           = $env:APP_VERSION.Trim()

          $outPath = (Resolve-Path "msix").Path + "\AppxManifest.xml"
          $settings = New-Object System.Xml.XmlWriterSettings
          $settings.Indent = $true
          $settings.IndentChars = "  "
          $settings.Encoding = New-Object System.Text.UTF8Encoding($false) # no BOM
          $settings.OmitXmlDeclaration = $false

          $w = [System.Xml.XmlWriter]::Create($outPath, $settings)

          $ns    = "http://schemas.microsoft.com/appx/manifest/foundation/windows10"
          $nsUap  = "http://schemas.microsoft.com/appx/manifest/uap/windows10"

          $w.WriteStartDocument()
          $w.WriteStartElement("Package", $ns)
          $w.WriteAttributeString("xmlns", "uap", $null, $nsUap)

            # Identity
            $w.WriteStartElement("Identity", $ns)
            $w.WriteAttributeString("Name",                 $packageName)
            $w.WriteAttributeString("Publisher",            $publisherId)
            $w.WriteAttributeString("Version",              $appVersion)
            $w.WriteAttributeString("ProcessorArchitecture","neutral")
            $w.WriteEndElement()

            # Properties
            $w.WriteStartElement("Properties", $ns)
              $w.WriteElementString("DisplayName",          $ns, "OpsManifest")
              $w.WriteElementString("PublisherDisplayName", $ns, $publisherDisplayName)
              $w.WriteElementString("Description",          $ns, "Guided provisioning workflow for infra teams")
              $w.WriteElementString("Logo",                 $ns, "images\StoreLogo.png")
            $w.WriteEndElement()

            # Dependencies
            $w.WriteStartElement("Dependencies", $ns)
              $w.WriteStartElement("TargetDeviceFamily", $ns)
              $w.WriteAttributeString("Name",               "Windows.Desktop")
              $w.WriteAttributeString("MinVersion",         "10.0.17763.0")
              $w.WriteAttributeString("MaxVersionTested",   "10.0.65535.65535")
              $w.WriteEndElement()
            $w.WriteEndElement()

            # Resources
            $w.WriteStartElement("Resources", $ns)
              $w.WriteStartElement("Resource", $ns)
              $w.WriteAttributeString("Language", "en-us")
              $w.WriteEndElement()
            $w.WriteEndElement()

            # Applications
            $w.WriteStartElement("Applications", $ns)
              $w.WriteStartElement("Application", $ns)
              $w.WriteAttributeString("Id",        "App")
              $w.WriteAttributeString("StartPage", "index.html")

                $w.WriteStartElement("VisualElements", $nsUap)
                $w.WriteAttributeString("DisplayName",         "OpsManifest")
                $w.WriteAttributeString("Description",         "Guided provisioning workflow for infra teams")
                $w.WriteAttributeString("BackgroundColor",     "#0F1F35")
                $w.WriteAttributeString("Square150x150Logo",   "images\Square150x150Logo.png")
                $w.WriteAttributeString("Square44x44Logo",     "images\Square44x44Logo.png")

                  $w.WriteStartElement("DefaultTile", $nsUap)
                  $w.WriteAttributeString("Wide310x150Logo",   "images\Wide310x150Logo.png")
                  $w.WriteAttributeString("Square310x310Logo", "images\Square310x310Logo.png")
                  $w.WriteAttributeString("Square71x71Logo",   "images\Square71x71Logo.png")
                  $w.WriteAttributeString("ShortName",         "OpsManifest")
                    $w.WriteStartElement("ShowNameOnTiles", $nsUap)
                      $w.WriteStartElement("ShowOn", $nsUap)
                      $w.WriteAttributeString("Tile", "square150x150Logo")
                      $w.WriteEndElement()
                      $w.WriteStartElement("ShowOn", $nsUap)
                      $w.WriteAttributeString("Tile", "wide310x150Logo")
                      $w.WriteEndElement()
                    $w.WriteEndElement()
                  $w.WriteEndElement() # DefaultTile

                  $w.WriteStartElement("SplashScreen", $nsUap)
                  $w.WriteAttributeString("Image",           "images\SplashScreen.png")
                  $w.WriteAttributeString("BackgroundColor", "#0F1F35")
                  $w.WriteEndElement()

                $w.WriteEndElement() # VisualElements

                # ApplicationContentUriRules - packaged web app: app content is
                # served from ms-appx-web:/// (the MSIX bundle), not from a CDN.
                # This eliminates cert-lab failures caused by unreachable *.pages.dev.
                $w.WriteStartElement("ApplicationContentUriRules", $nsUap)
                  $w.WriteStartElement("Rule", $nsUap)
                  $w.WriteAttributeString("Type",  "include")
                  $w.WriteAttributeString("Match", "ms-appx-web:///")
                  $w.WriteEndElement()
                  $w.WriteStartElement("Rule", $nsUap)
                  $w.WriteAttributeString("Type",  "include")
                  $w.WriteAttributeString("Match", "ms-appx-web:///*")
                  $w.WriteEndElement()
                $w.WriteEndElement()

              $w.WriteEndElement() # Application
            $w.WriteEndElement() # Applications

            # Capabilities
            $w.WriteStartElement("Capabilities", $ns)
              # Outbound internet (client): Firebase, Groq, Azure TTS, endoflife.date
              $w.WriteStartElement("Capability", $ns)
              $w.WriteAttributeString("Name", "internetClient")
              $w.WriteEndElement()
              # Outbound internet (client+server): required for some WebView2 network paths
              $w.WriteStartElement("Capability", $ns)
              $w.WriteAttributeString("Name", "internetClientServer")
              $w.WriteEndElement()
              # Note: microphone DeviceCapability removed — voice input has been removed from the app
            $w.WriteEndElement()

          $w.WriteEndElement() # Package
          $w.WriteEndDocument()
          $w.Flush()
          $w.Close()

          # Show the exact bytes of PublisherDisplayName for verification
          $xml = [xml](Get-Content $outPath -Raw)
          $stored = $xml.Package.Properties.PublisherDisplayName
          $bytes  = [System.Text.Encoding]::UTF8.GetBytes($stored) | ForEach-Object { $_.ToString("X2") }
          Write-Host "PublisherDisplayName value : '$stored'"
          Write-Host "PublisherDisplayName bytes : $($bytes -join ' ')"
          Write-Host "AppxManifest.xml written to $outPath"

      - name: Generate resources.pri
        shell: powershell
        run: |
          # Write priconfig.xml using XmlWriter (same pattern as AppxManifest step).
          # Avoids all PowerShell string-quoting edge cases and em-dash encoding issues.
          # Scopes indexing to \images only -- prevents corrupt .pri from JS/woff2 files.
          $priPath = (Resolve-Path "msix").Path + "\priconfig.xml"
          $xws = New-Object System.Xml.XmlWriterSettings
          $xws.Indent = $true
          $xws.IndentChars = "  "
          $xws.Encoding = New-Object System.Text.UTF8Encoding($false)
          $xws.OmitXmlDeclaration = $false
          $pw = [System.Xml.XmlWriter]::Create($priPath, $xws)
          $pw.WriteStartDocument()
          $pw.WriteStartElement("resources")
          $pw.WriteAttributeString("targetOsVersion", "10.0.0")
          $pw.WriteAttributeString("majorVersion", "1")
            $pw.WriteStartElement("packaging")
              $pw.WriteStartElement("autoResourcePackage")
              $pw.WriteAttributeString("qualifier", "Language")
              $pw.WriteEndElement()
            $pw.WriteEndElement()
            $pw.WriteStartElement("index")
            $pw.WriteAttributeString("root", "\")
            $pw.WriteAttributeString("startIndexAt", "\images")
              $pw.WriteStartElement("default")
                $pw.WriteStartElement("qualifier")
                $pw.WriteAttributeString("name", "Language")
                $pw.WriteAttributeString("value", "en-US")
                $pw.WriteEndElement()
              $pw.WriteEndElement()
            $pw.WriteEndElement()
          $pw.WriteEndElement()
          $pw.WriteEndDocument()
          $pw.Flush()
          $pw.Close()
          Write-Host "priconfig.xml written to $priPath"

          $makepri = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter makepri.exe -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1

          if (-not $makepri) {
            Write-Error "makepri.exe not found - resources.pri cannot be generated"
            exit 1
          }

          Write-Host "makepri: $($makepri.FullName)"
          & $makepri.FullName new /pr msix /cf msix\priconfig.xml /mn msix\AppxManifest.xml /of msix\resources.pri /o
          if ($LASTEXITCODE -ne 0) { Write-Error "makepri failed (exit $LASTEXITCODE)"; exit 1 }

          if (-not (Test-Path "msix\resources.pri")) {
            Write-Error "resources.pri not generated"
            exit 1
          }
          $sz = (Get-Item "msix\resources.pri").Length
          Write-Host "resources.pri OK - $sz bytes"

      - name: Package MSIX with MakeAppx
        shell: powershell
        run: |
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter makeappx.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like "*x64*" } |
            Sort-Object FullName -Descending | Select-Object -First 1

          if (-not $makeappx) {
            $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
              -Recurse -Filter makeappx.exe -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1
          }

          if (-not $makeappx) {
            Write-Error "makeappx.exe not found"
            exit 1
          }

          Write-Host "makeappx: $($makeappx.FullName)"
          & $makeappx.FullName pack /d msix /p opsmanifest.msix /o
          Write-Host "MSIX created"

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: opsmanifest-msix
          path: opsmanifest.msix
          retention-days: 30

      - name: Upload store listing images
        uses: actions/upload-artifact@v4
        with:
          name: store-listing-images
          path: store-listing-images\
          retention-days: 30
